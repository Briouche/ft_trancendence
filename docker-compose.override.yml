services:
  proxy:
    image: nginx:stable-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/dev.conf:/etc/nginx/nginx.conf:ro

  app:
    build:
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    command: npm run start:dev

  game_engine:
    build:
      target: development
    ports:
      - "4000:4000"
    volumes:
      - ./game_engine:/app
      - /app/node_modules

  socketio:
    build:
      target: development
    ports:
      - "4001:4000"
    volumes:
      - ./socket-server:/app
      - /app/node_modules

  redis:
    ports:
     - "6380:6379"

  db:
    ports:
     - "5432:5432"
