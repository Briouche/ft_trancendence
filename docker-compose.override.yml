services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro

  app:
    build:
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

  postgres:
    ports:
      - "5432:5432"

volumes:
  app_node_modules:
  app_next:
