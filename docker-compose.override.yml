# Development overlay, loaded automatically by `docker compose up` (see Makefile `dev`): hot
# reload with the sources bind-mounted, HTTPS on https://localhost:8080.
# Only nginx is published. The other services are reachable only through it (so only over TLS),
# except Postgres on the loopback interface for local tools (prisma studio, psql).
services:
  proxy:
    build:
      context: ./proxy
      target: development
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/dev.conf:/etc/nginx/nginx.conf:ro

  app:
    build:
      target: development
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    command: npm run start:dev

  game_engine:
    build:
      target: development
    volumes:
      - ./game_engine:/app
      - /app/node_modules

  socketio:
    build:
      target: development
    volumes:
      - ./socket-server:/app
      - /app/node_modules

  db:
    ports:
      - "127.0.0.1:5432:5432"
