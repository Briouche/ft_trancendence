services:
  proxy:
    build:
      context: ./proxy
      target: development
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/dev.conf:/etc/nginx/nginx.conf:ro

  app:
    build:
      target: development
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    command: npm run start:dev

  game_engine:
    build:
      target: development
    volumes:
      - ./game_engine:/app
      - /app/node_modules

  socketio:
    build:
      target: development
    volumes:
      - ./socket-server:/app
      - /app/node_modules

  # Loopback only, for local DB tools (prisma studio, psql). Every other service is reachable only
  # through the HTTPS proxy.
  db:
    ports:
     - "127.0.0.1:5432:5432"
