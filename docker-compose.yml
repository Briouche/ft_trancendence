services:
  proxy:
    container_name: nginx_proxy
    depends_on:
      - app
      - socketio
    networks:
      - frontend

  app:
    container_name: nextjs_app
    build:
      context: ./app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_REDIRECT_URI: ${FT_REDIRECT_URI}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same policy as game_engine below. Without it a single exit of `next dev` — for any reason,
    # clean or not — blackholes the whole site until someone re-runs `make`: nginx keeps the
    # cached IP for `valid=10s` and refuses connections, then can't resolve `app` at all and 502s
    # everything (including /textures/cards/images/*.webp mid-match), and the socket.io reconnect
    # that would have resumed a live match never gets a page to run in.
    restart: unless-stopped
    networks:
      - frontend
      - backend

  socketio:
    container_name: socketio_server
    build:
      context: ./socket-server
    environment:
      REDIS_URL: redis://redis:6379
      # Connections are authenticated by asking the app who the session cookie belongs to
      # (GET /api/auth/me), so this service needs neither the JWT secret nor the database.
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  redis:
    container_name: redis_server
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    volumes:
      - redis_data:/data

  game_engine:
    container_name: game_engine
    build:
      context: .
      dockerfile: game_engine/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Same secret as the app: this process verifies the session cookie the app issued, so the
      # socket can be tied to an authenticated account (see game_engine/srcs/auth/session.ts).
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    container_name: postgres_db
    image: postgres:16-alpine
    command: [ "postgres", "-c", "log_min_duration_statement=200" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-myuser} -d $${POSTGRES_DB:-mydb}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  backend:
  frontend:

volumes:
  db_data:
  redis_data:
