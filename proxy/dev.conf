worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Essential for WebSocket upgrading (HMR & Socket.io)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS Docker embarqué (127.0.0.11) + hostname en variable dans proxy_pass (au lieu d'un bloc
    # upstream{} statique) : nginx ne résout un nom de service Docker qu'UNE SEULE FOIS, au
    # démarrage, avec un upstream{} classique. En dev, app/game_engine redémarrent sans arrêt
    # (Turbopack, crash ts-node, rebuild manuel) et changent d'IP à chaque fois — nginx continuait
    # sinon à taper sur l'ancienne IP (souvent devenue celle d'un AUTRE conteneur entre-temps,
    # d'où des 502 "connection refused" jusqu'à un restart manuel de nginx_proxy). Passer le host
    # par une variable force nginx à revalider le DNS toutes les `valid` secondes au lieu de le
    # figer au démarrage.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        # 1. Main Next.js Web Traffic
        location / {
            set $nextjs_upstream app:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade             $http_upgrade;
            proxy_set_header Connection          $connection_upgrade;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
        }

        # 2. Next.js HMR WebSocket (Hot Reloading)
        location /_next/webpack-hmr {
            set $nextjs_upstream app:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;

            # Prevents dev server from constantly disconnecting during inactivity
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Socket.io Support — the game server (gameEngine/, its own Node process, NOT part
        # of the Next.js app) speaks socket.io on its own port; proxied here under the same
        # origin so the client never needs to know its host/port directly (see EventManager.ts).
        location /socket.io/ {
            set $game_engine_upstream game_engine:4000;
            proxy_pass http://$game_engine_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;

            # Crucial for keeping Socket.io connections alive without timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Chat/presence Socket.io Support — separate process (socket-server/) from
        # game_engine, on its own path since both speak socket.io on the same default path
        # otherwise. Must match the `path` the socketio server itself listens on (index.js).
        location /chat-socket.io/ {
            set $socketio_upstream socketio:4000;
            proxy_pass http://$socketio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
