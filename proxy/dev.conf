worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's DNS, re-resolved every 10s so restarted containers keep being reached.
    resolver 127.0.0.11 valid=10s;

    server {
        # TLS even in development: the subject requires HTTPS for every connection to the backend
        # (pages, API and wss:// sockets). The certificate is self-signed (see proxy/Dockerfile).
        listen 8080 ssl;
        listen [::]:8080 ssl;
        http2 on;
        server_name localhost;

        # Avatar uploads are up to 2 MB (app/lib/avatarStorage.ts); nginx's default is 1 MB.
        client_max_body_size 3m;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # A plain-HTTP request on this TLS port (http://localhost:8080) gets nginx's non-standard
        # 497 status; answer it with a redirect to the same URL over HTTPS instead.
        error_page 497 =301 https://$host:$server_port$request_uri;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Next.js app
        location / {
            set $nextjs_upstream app:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade             $http_upgrade;
            proxy_set_header Connection          $connection_upgrade;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;

            # nginx's 60s default has been observed to fire as a 504 on slow/low-core machines:
            # Turbopack dev compiles a route on-demand on its first hit (measured 7-12s on a
            # normal dev machine — proportionally longer on weaker hardware), on top of whatever
            # is still finishing in `prisma migrate deploy && prisma db seed` at container start.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ~ ^/_next/(hmr|webpack-hmr) {
            set $nextjs_upstream app:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Game server (game_engine) socket.io
        location /socket.io/ {
            set $game_engine_upstream game_engine:4000;
            proxy_pass http://$game_engine_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Chat/presence server (socket-server) socket.io
        location /chat-socket.io/ {
            set $socketio_upstream socketio:4000;
            proxy_pass http://$socketio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $http_host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
