services:
  proxy:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always

  app:
    build:
      target: production
    restart: always
    command: sh -c "npx prisma migrate deploy && node server.js"

  db:
    restart: always


