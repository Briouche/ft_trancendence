<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <filter id="grainLight" x="-20%" y="-20%" width="140%" height="140%">
      <!-- fine grain -->
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="fine"/>
      <!-- larger cloudy mottling -->
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="42" result="mottle"/>
      <feBlend in="fine" in2="mottle" mode="multiply" result="noise"/>
      <!-- convert to grayscale luminance -->
      <feColorMatrix in="noise" type="matrix"
        values="0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0    0    0    1 0" result="gray"/>
      <!-- keep it subtle: low contrast, mostly transparent, dark specks only -->
      <feComponentTransfer in="gray" result="graded">
        <feFuncR type="linear" slope="0.4" intercept="0"/>
        <feFuncG type="linear" slope="0.4" intercept="0"/>
        <feFuncB type="linear" slope="0.4" intercept="0"/>
        <feFuncA type="linear" slope="0.22" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- light base, slightly darkened -->
  <rect width="300" height="300" fill="#f0f0f0"/>
  <!-- faint grain overlay for texture -->
  <rect width="300" height="300" filter="url(#grainLight)"/>
</svg>
