worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Essential for WebSocket upgrading (HMR & Socket.io)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nextjs_upstream {
        server app:3000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # 1. Main Next.js Web Traffic
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
        }

        # 2. Next.js HMR WebSocket (Hot Reloading)
        location /_next/webpack-hmr {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            
            # Prevents dev server from constantly disconnecting during inactivity
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Socket.io Support
        location /socket.io/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;

            # Crucial for keeping Socket.io connections alive without timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
