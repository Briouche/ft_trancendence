# Not finished

worker_processes auto;

events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handles both WebSocket upgrades and normal HTTP keep-alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nextjs_upstream {
        server app:3000;
    }

    # 1. HTTP to HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com www.yourdomain.com;

        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name yourdomain.com www.yourdomain.com;

        # SSL Certificate Paths (paths inside the nginx container)
        ssl_certificate     /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem;

        # TLS Protocol Requirements
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Secure Cipher Suites (optimized for TLS 1.2 and 1.3)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # SSL Session Optimization
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options        "SAMEORIGIN"             always;
        add_header X-Content-Type-Options "nosniff"                always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;
        # TODO: tighten CSP — remove 'unsafe-inline' and http: once you know your asset origins
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        # Enable HSTS once cert renewal is validated and you are committed to HTTPS
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Next.js static assets — proxied to app container
        # TODO: serve directly from a shared volume (mount .next/static into nginx)
        #       to avoid the round-trip to the app container on every static request.
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Main application reverse proxy
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
